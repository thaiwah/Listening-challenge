main{max-width:680px;margin:0 auto;padding:70px 18px 40px}

function wrap(ctx,text,maxW){

 var lines=[],cur="";

 if(cur.trim())lines.push(cur.trim());return lines;
}

 c.fillStyle="#fff";rr(c,50,50,980,1250,48);c.fill();
